server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Links antigos do mapa continuam funcionando.
    location = /mapa/ {
        return 301 /mapa;
    }

    # SPA na raiz: / e /mapa caem no mesmo index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/html
        application/json
        application/geo+json
        application/geojson+json
        application/javascript
        text/javascript
        text/css
        text/plain
        image/svg+xml;

    # O TLS/HSTS fica no túnel; aqui só os cabeçalhos do app interno.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # O Cloudflare injeta o beacon de Web Analytics (RUM) no HTML de verdadeiros
    # navegadores: static.cloudflareinsights.com/beacon.min.js + POST para
    # cloudflareinsights.com/cdn-cgi/rum. Só esses dois hosts entram na política;
    # o resto continua fechado (sem 'unsafe-inline' em script, sem curinga).
    add_header Content-Security-Policy "script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com; connect-src 'self' https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://cloudflareinsights.com; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
}
