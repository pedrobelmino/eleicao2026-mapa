# Endurecimento do front (nginx 1.29).
#
# DOIS servidores, de propósito:
#   * listen 80   → site público. Publicado só em 127.0.0.1:8110 no host e é o
#                   alvo do túnel Cloudflare (eleicao2026.belmino.dev).
#                   /api/interno/* responde 404 SEMPRE, com ou sem token.
#   * listen 8081 → painel privado. Publicado só em 127.0.0.1:8112 e o túnel
#                   NÃO aponta para cá: nenhum hostname público chega nele.
#                   Aqui (e só aqui) /api/interno/* é proxiado para o Go.
#
# Três camadas de defesa, também de propósito:
#   * nginx — cabeçalhos, teto de corpo/cabeçalho, rate limit e concorrência por
#     IP, 404 seco para caminho sensível, espelho de visita e a LISTA DE
#     BLOQUEIO por IP (geo + if) que o vigia de ataques mantém;
#   * Go (/api/) — validação de parâmetros, limite próprio, token do painel;
#   * vigia (systemd --user, 1 min) — lê o log de defesa e bloqueia quem estoura.
#
# Este arquivo é incluído dentro do bloco `http`, então as zonas de limite
# (que só existem no contexto http) ficam aqui em cima, fora dos `server`.

# 40 req/s por IP com rajada de 200. Um navegador abrindo o mapa gasta ~6
# chamadas; quem varre a API em loop estoura a rajada e recebe 429.
limit_req_zone $binary_remote_addr zone=api:10m rate=40r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

# Zona própria da rota que FALA COM O TSE. /api/fonte é a pergunta "o TSE já
# publicou?" e cada cache miss do Go é uma requisição contra a fonte oficial
# (janela de 60 s, ver api/fonte_rotas.go). Sem limite próprio, quem varre essa
# rota com a janela fria transforma o painel em amplificador contra o TSE.
# 2 r/s por IP com rajada de 3: cobre a página (uma chamada), o vigia de turno
# (uma) e uma aba recarregando — e corta laço de varredura com 429.
limit_req_zone $binary_remote_addr zone=fonte:10m rate=2r/s;

# Log de DEFESA (não é log de acesso comum): só o que o vigia precisa para
# contar por IP — origem, instante, status, método e caminho (sem query string,
# para o token do painel nunca entrar em log). Fica em /var/log/defesa, fora de
# qualquer raiz servida, é truncado pelo próprio vigia e é o ÚNICO lugar desta
# stack onde um IP aparece. Retenção curta, por construção.
#
# Formato (campos separados por UM espaço, os 8 primeiros são fixos):
#
#   1 $remote_addr         IP REAL do visitante (real_ip acima, não o do Cloudflare)
#   2 $time_iso8601        instante
#   3 $status              código
#   4 $request_method      método
#   5 $uri                 caminho SEM query (compatível com as linhas antigas)
#   6 $host                host pedido: separa eleicao2026 de belmino.dev de scanner
#   7 $bloqueado_ip       1 = IP já estava na lista do vigia (resposta 403)
#   8 $alvo_defesa         caminho COM query (mascarado se tiver "token=")
#   9.. $http_user_agent   resumo do UA — último campo, então pode ter espaços
#
# As linhas gravadas ANTES desta mudança têm 5 campos (sem host/UA); quem lê
# trata "menos de 8 campos" como linha antiga e usa host "?" (ver
# scripts/defesa/vigia_ataques.py e monitor/logwatch.go). O vigia só olha os 5
# primeiros campos, então continua lendo as duas formas sem alteração.
#
# escape=default: aspas, barra invertida e caracteres de controle saem como
# \xHH — um UA malicioso com quebra de linha não consegue forjar uma linha
# nova no log (o que viraria um IP falso para o vigia).
log_format defesa escape=default '$remote_addr $time_iso8601 $status $request_method $uri $host $bloqueado_ip "$alvo_defesa" $http_user_agent';

# Linha de requisição CRUA, entre aspas (as aspas delimitam o campo: o valor
# tem espaços). Vem de $request e não de $request_uri de propósito: quando o
# nginx normaliza o caminho (ex.: /mapa/../etc/passwd) ele anula
# $request_uri ("-"), mas $request preserva o ataque como veio. Se a URL
# trouxer "token=", o campo inteiro é substituído — o token do painel de
# métricas nunca vai para o log.
map $request $alvo_defesa {
    default $request;
    ~*(?i)token= "/[alvo-mascarado-por-token]";
}

# Lista de bloqueio: linhas "IP 1;" escritas pelo vigia.
# Arquivo ausente quebra o nginx de propósito? Não: `include` de arquivo
# inexistente é erro de configuração. Por isso o arquivo PRECISA existir (vazio
# é válido). Ele não é versionado de propósito — o vigia o reescreve a cada
# bloqueio e sujaria o `git status` durante a apuração. Numa máquina nova:
#   mkdir -p var/defesa && printf '# lista vazia\n' > var/defesa/bloqueios.conf
geo $bloqueado_ip {
    default 0;
    include /etc/nginx/defesa/bloqueios.conf;
}

server {
    listen 80;
    server_name _;

    # Sem versão do nginx no cabeçalho Server e sem listagem de diretório.
    server_tokens off;
    autoindex off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # O IP real chega pelo túnel Cloudflare (que roda em 127.0.0.1). Quem pode
    # ditar o IP é só a borda: loopback/rede local (túnel, docker, painel) e as
    # faixas OFICIAIS da Cloudflare — sem elas, uma conexão vinda da borda por
    # IPv6 (2a06:98c0::/29 …) tinha o CF-Connecting-IP IGNORADO e o log gravava
    # o IP DA CLOUDFLARE no lugar do visitante: o scanner sumia e o escore
    # acusava a borda (24/10, 2a06:98c0:3600::103 com escore 35 em belmino.dev).
    #
    # Faixas oficiais: https://www.cloudflare.com/ips-v4 e /ips-v6 — copiadas
    # aqui de propósito (a lista muda raramente e um include remoto não existe
    # em nginx). Conferir com:
    #   curl -s https://www.cloudflare.com/ips-v4 https://www.cloudflare.com/ips-v6
    # Qualquer outra origem continua com o $remote_addr do próprio socket.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    # --- Cloudflare IPv4 (15 faixas oficiais)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # --- Cloudflare IPv6 (7 faixas oficiais)
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Nada nesta aplicação recebe upload. Teto pequeno corta payload gigante
    # antes de chegar ao Go (413 em vez de memória gasta).
    client_max_body_size 8k;
    client_body_buffer_size 8k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # IP na lista do vigia: 403 para ele, 200 para o resto do mundo.
    if ($bloqueado_ip) {
        return 403;
    }

    # Log de defesa (por IP). `off` continua valendo para o resto: nenhum outro
    # arquivo de log recebe requisição.
    access_log /var/log/defesa/acessos.log defesa;
    error_log /var/log/nginx/error.log warn;

    # ---------------------------------------------------------- cabeçalhos
    # Repetidos de propósito no /api/ (proxy_hide_header esconde os do Go):
    # um cabeçalho por nome, sempre com o valor definido aqui.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header X-Permitted-Cross-Domain-Policies none always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    # CSP: só o necessário para o MapLibre (tiles CARTO, worker/blob) e para o
    # beacon de Web Analytics que o Cloudflare injeta em navegador real.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com; connect-src 'self' https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://cloudflareinsights.com; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    # -------------------------------------------------- painel privado: 404
    # A rota interna NÃO existe no servidor público. 404 seco, mesmo com token
    # válido: a credencial não é a única barreira, o caminho também não existe
    # aqui. O painel mora no `listen 8081` (127.0.0.1:8112), fora do túnel.
    location ^~ /api/interno/ {
        return 404;
    }

    # Painel de monitoramento (8113, fora deste container) também não existe
    # aqui: sem isto o catch-all do SPA devolveria o index.html em 200 e um
    # scanner acharia que a rota existe. 404 seco, com ou sem cabeçalho.
    location ^~ /monitor {
        return 404;
    }

    location ^~ /api/monitor/ {
        return 404;
    }

    # ------------------------------------------------- rota da fonte (TSE)
    # Bloco próprio, e por isso repete o proxy de /api/: o nginx não herda
    # limit_req (nem nada de location) — a única forma de dar um limite
    # apertado a UMA rota é declará-la aqui. Só o limite muda; cabeçalhos,
    # timeouts e o apagamento de X-Painel-Local são os mesmos.
    location = /api/fonte {
        limit_req zone=fonte burst=3 nodelay;
        limit_conn api_conn 4;

        proxy_pass http://api:8080/api/fonte;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header X-Painel-Local "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering on;

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;

        error_page 429 = @muitas_requisicoes;
        error_page 400 = @requisicao_invalida;
    }

    # ------------------------------------------------------------- API
    location /api/ {
        # ^ include: uma linha por limite, para o plantão poder mexer sem
        # procurar no arquivo.
        limit_req zone=api burst=200 nodelay;
        limit_conn api_conn 40;

        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Marca de acesso local APAGADA na borda: este servidor é público. Sem
        # esta linha, um cliente mandaria "X-Painel-Local: 1" e o Go veria a
        # marca chegando do proxy, que é justamente quem ele confia. Valor
        # vazio = cabeçalho não repassado.
        proxy_set_header X-Painel-Local "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering on;

        # O Go já manda estes; esconde para não duplicar (as add_header do
        # server continuam valendo).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;

        error_page 429 = @muitas_requisicoes;
        error_page 413 = @corpo_grande;
        error_page 400 = @requisicao_invalida;
    }

    location @muitas_requisicoes {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"erro":"muitas requisições"}\n';
    }

    location @corpo_grande {
        default_type application/json;
        return 413 '{"erro":"corpo grande demais"}\n';
    }

    location @requisicao_invalida {
        default_type application/json;
        return 400 '{"erro":"requisição inválida"}\n';
    }

    # Espelho da visita: subrequisição em segundo plano (não segura nem afeta a
    # resposta da página). Grava a visita anônima; o IP não é guardado, só o
    # hash do dia.
    #
    # /api/visita NÃO é rota pública: quem grava é este mirror, que fala direto
    # com o container `api`. Aberta pela borda, qualquer um inflaria a contagem.
    location = /api/visita {
        return 404;
    }

    location = /_visita {
        internal;
        proxy_pass http://api:8080/api/visita;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Painel-Local "";
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
    }

    # ------------------------------------------------------------ página
    # Links antigos do mapa continuam funcionando.
    location = /mapa/ {
        return 301 /mapa;
    }

    location = /mapa {
        mirror /_visita;
        mirror_request_body off;
        try_files /index.html =404;
    }

    # A contagem anônima de visita passa a ser na página do painel: o 302 da
    # raiz não é página, então nada seria medido ali.
    location = /eleicao {
        mirror /_visita;
        mirror_request_body off;
        try_files /index.html =404;
    }

    # A raiz é a porta de entrada do painel; a landing mora em /sobre.
    #
    # no-store: nem a borda da Cloudflare nem o navegador podem prender esta
    # decisão de rota no cache. E o 302 é resposta de verdade, então repete os
    # cabeçalhos de segurança do server: `add_header` em location DESCARTA os
    # herdados (um add_header aqui anula os do bloco `server`).
    location = / {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        return 302 /eleicao;
    }

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    # robots.txt: a borda da Cloudflare cacheia estático com o max-age daqui
    # (4 h, padrão do nginx). Uma hora basta para uma regra nova não ficar
    # invisível na borda pelo resto do dia.
    location = /robots.txt {
        expires 1h;
        try_files $uri =404;
    }

    # Caminho sensível não é servido nem listado: 404 seco, sem dizer se existe.
    location ~ /\. {
        return 404;
    }

    location ^~ /dados/ {
        return 404;
    }

    # Fonte, banco e script nunca são conteúdo estático deste site.
    location ~* \.(?:go|py|sh|md|conf|db|db-wal|db-shm|sqlite|jsonl|mmdb|salt|log)$ {
        return 404;
    }

    # SPA na raiz: o resto cai no index.html (nada de listagem de diretório).
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/geo+json
        application/geojson+json
        application/javascript
        text/javascript
        text/css
        text/plain
        image/svg+xml;
}

# ---------------------------------------------------------------- painel só local
# Servidor do painel privado. Publicado no host APENAS em 127.0.0.1:8112
# (compose.yaml) e o túnel Cloudflare não aponta para esta porta: não existe
# hostname público que chegue aqui. Sem log de acesso (o token viaja na URL) e
# SEM a lista de bloqueio — a defesa nunca pode trancar o painel de plantão.
server {
    listen 8081;
    server_name _;

    server_tokens off;
    autoindex off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;

    access_log off;
    error_log /var/log/nginx/error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    # Painel e JSON de métricas: só aqui.
    #
    # ACESSO LOCAL SEM TOKEN (decisão do Pedro, 24/10): este é o ÚNICO ponto da
    # stack que injeta a marca X-Painel-Local: 1, e ele só existe nesta porta —
    # publicada no host exclusivamente em 127.0.0.1:8112 (compose.yaml) e fora
    # do túnel Cloudflare. O valor é escrito AQUI, sempre: proxy_set_header
    # substitui o que o cliente tiver mandado, então "X-Painel-Local: 1" vindo
    # de fora não sobrevive. O server block público (listen 80) apaga a marca
    # antes de proxiar e responde 404 seco em /api/interno/.
    #
    # A decisão do Go não olha X-Real-IP nem X-Forwarded-For (forjáveis): exige
    # a marca do proxy E par de rede privado. Dentro do container o loopback do
    # host aparece como o gateway do docker (medido: 172.17.0.1), então
    # "RemoteAddr == 127.0.0.1" não existe aqui e não é usado como critério.
    location ^~ /api/interno/ {
        proxy_pass http://api:8080/api/interno/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header X-Painel-Local "1";
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;

        add_header Cache-Control "no-store" always;
    }

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    # Qualquer outra coisa nesta porta é 404: o painel privado não serve o site.
    location / {
        return 404;
    }
}
