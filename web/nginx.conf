# Endurecimento do front (nginx 1.29, 127.0.0.1:8110).
#
# Duas camadas de defesa, de propósito:
#   * nginx — cabeçalhos de segurança, teto de corpo/cabeçalho, rate limit e
#     concorrência por IP, 404 seco para caminho sensível, espelho de visita;
#   * Go (/api/) — segunda barreira: validação de parâmetros, limite próprio e
#     o painel privado de métricas.
#
# Este arquivo é incluído dentro do bloco `http`, então as zonas de limite
# (que só existem no contexto http) ficam aqui em cima, fora do `server`.

# 40 req/s por IP com rajada de 200. Um navegador abrindo o mapa gasta ~6
# chamadas; quem varre a API em loop estoura a rajada e recebe 429.
limit_req_zone $binary_remote_addr zone=api:10m rate=40r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

server {
    listen 80;
    server_name _;

    # Sem versão do nginx no cabeçalho Server e sem listagem de diretório.
    server_tokens off;
    autoindex off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # O IP real chega pelo proxy do painel (8099), que roda na máquina. Só
    # confiamos em faixas locais/privadas; qualquer outra origem tem o
    # $remote_addr do próprio socket (não dá para forjar de fora).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;
    real_ip_recursive on;

    # Nada nesta aplicação recebe upload. Teto pequeno corta payload gigante
    # antes de chegar ao Go (413 em vez de memória gasta).
    client_max_body_size 8k;
    client_body_buffer_size 8k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # ---------------------------------------------------------- cabeçalhos
    # Repetidos de propósito no /api/ (proxy_hide_header esconde os do Go):
    # um cabeçalho por nome, sempre com o valor definido aqui.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header X-Permitted-Cross-Domain-Policies none always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    # CSP: só o necessário para o MapLibre (tiles CARTO, worker/blob) e para o
    # beacon de Web Analytics que o Cloudflare injeta em navegador real.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com; connect-src 'self' https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://cloudflareinsights.com; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    # Nenhum log de acesso: o cabeçalho do Cloudflare traz IP e o token do
    # painel privado viaja na URL. Quem loga requisição é o Go, sem IP.
    access_log off;

    # ------------------------------------------------------------- API
    location /api/ {
        # ^ include: uma linha por limite, para o plantão poder mexer sem
        # procurar no arquivo.
        limit_req zone=api burst=200 nodelay;
        limit_conn api_conn 40;

        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering on;

        # O Go já manda estes; esconde para não duplicar (as add_header do
        # server continuam valendo).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;

        error_page 429 = @muitas_requisicoes;
        error_page 413 = @corpo_grande;
        error_page 400 = @requisicao_invalida;
    }

    location @muitas_requisicoes {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"erro":"muitas requisições"}\n';
    }

    location @corpo_grande {
        default_type application/json;
        return 413 '{"erro":"corpo grande demais"}\n';
    }

    location @requisicao_invalida {
        default_type application/json;
        return 400 '{"erro":"requisição inválida"}\n';
    }

    # Espelho da visita: subrequisição em segundo plano (não segura nem afeta a
    # resposta da página). Grava a visita anônima; o IP não é guardado, só o
    # hash do dia.
    #
    # /api/visita NÃO é rota pública: quem grava é este mirror, que fala direto
    # com o container `api`. Aberta pela borda, qualquer um inflaria a contagem.
    location = /api/visita {
        return 404;
    }

    location = /_visita {
        internal;
        proxy_pass http://api:8080/api/visita;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent $http_user_agent;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
    }

    # ------------------------------------------------------------ página
    # Links antigos do mapa continuam funcionando.
    location = /mapa/ {
        return 301 /mapa;
    }

    location = /mapa {
        mirror /_visita;
        mirror_request_body off;
        try_files /index.html =404;
    }

    location = / {
        mirror /_visita;
        mirror_request_body off;
        try_files /index.html =404;
    }

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    # Caminho sensível não é servido nem listado: 404 seco, sem dizer se existe.
    location ~ /\. {
        return 404;
    }

    location ^~ /dados/ {
        return 404;
    }

    # Fonte, banco e script nunca são conteúdo estático deste site.
    location ~* \.(?:go|py|sh|md|conf|db|db-wal|db-shm|sqlite|jsonl|mmdb|salt)$ {
        return 404;
    }

    # SPA na raiz: o resto cai no index.html (nada de listagem de diretório).
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/geo+json
        application/geojson+json
        application/javascript
        text/javascript
        text/css
        text/plain
        image/svg+xml;
}
