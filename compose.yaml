services:
  api:
    build: ./api
    # Roda com o mesmo uid do dono dos dados: o SQLite de visitas é
    # compartilhado com o painel Python (8099) na máquina, e arquivo criado
    # como root quebraria a escrita do painel.
    user: "${UID_PAINEL:-1000}:${GID_PAINEL:-1000}"
    environment:
      ELEICAO: ${ELEICAO:-6257}
      TURNO: ${TURNO:-1}
      DADOS_DIR: /dados
      PORT: "8080"
      # Contagem anônima: mesmo banco e mesmo sal do painel Python.
      METRICAS_DIR: /metricas
      METRICAS_DB: /metricas/visitas.db
      METRICAS_SAL: /metricas/.salt
      METRICAS_GEO: /metricas/geo/dbip-city-lite.mmdb
      # Estado do vigia de ataques (bloqueios por IP): leitura, para o painel.
      DEFESA_ESTADO: /defesa/estado.json

      # Painel privado: sem token no ambiente, a rota responde 403 (falha fechada).
      METRICAS_TOKEN: ${METRICAS_TOKEN:-}
      # Limites do Go (segunda barreira, depois do nginx).
      RATE_TAXA_POR_IP: ${RATE_TAXA_POR_IP:-40}
      RATE_RAJADA_POR_IP: ${RATE_RAJADA_POR_IP:-120}
      LIMITE_SIMULTANEAS: ${LIMITE_SIMULTANEAS:-256}
      LIMITE_SIMULTANEAS_POR_IP: ${LIMITE_SIMULTANEAS_POR_IP:-24}
      WEB_HEALTH_URL: http://web/healthz
    volumes:
      - ./dados:/dados:ro
      - ${METRICAS_HOST_DIR:-/home/pedro/.hermes/painel_publico}:/metricas
      # Estado do vigia de ataques (só leitura: quem escreve é o vigia, no host).
      - ./var/defesa:/defesa:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Site público: loopback + túnel Cloudflare. Nada além disto é publicado.
      - "127.0.0.1:8110:80"
      # Painel privado: SÓ loopback. O túnel não aponta para cá (ver
      # ~/.cloudflared/belmino-eleicao.yml) e não há hostname público para ele.
      #
      # Por que a porta do painel NÃO é publicada direto no container `api`:
      # medido nesta máquina, uma conexão do host para 127.0.0.1:<porta>
      # publicada chega ao container com RemoteAddr = IP do gateway docker
      # (172.17.0.1), nunca 127.0.0.1. Publicar o Go direto daria acesso sem
      # token a qualquer par da rede docker e não daria para distinguir o
      # loopback real. Aqui o loopback é garantido pelo publish em 127.0.0.1 e
      # é o server block 8081 que injeta a marca X-Painel-Local: 1 (o público
      # apaga a marca e responde 404 em /api/interno/).
      - "127.0.0.1:8112:8081"
    volumes:
      # Log por IP que o vigia lê (0600, truncado pelo próprio vigia) e a lista
      # de bloqueio que o nginx aplica (geo + if).
      - ./var/defesa:/var/log/defesa
      - ./var/defesa:/etc/nginx/defesa:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
